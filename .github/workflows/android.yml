name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Works both ways: upload the .zip as it is (no extracting), or upload the extracted files.
      - name: Find project (unzips automatically if a .zip was uploaded)
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' -not -path './_nova_src/*' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p _nova_src
            unzip -q -o "$ZIP" -d _nova_src
          fi
          SETTINGS=$(find . \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$SETTINGS" ]; then echo "No Gradle project found (no settings.gradle.kts)"; exit 1; fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
